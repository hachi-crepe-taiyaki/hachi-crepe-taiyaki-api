spring.application.name=api

# Habilita o console web do H2
spring.h2.console.enabled=true

# Caminho do console H2
spring.h2.console.path=/h2-console

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JWT: configure JWT_SECRET with a long random secret outside local development.
app.jwt.secret=${JWT_SECRET:local-development-secret-change-before-deploy-123456}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# Set true behind HTTPS in production.
app.cookie.secure=${COOKIE_SECURE:false}

# Comma-separated frontend origins. Never use * when cookies are enabled.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5500}
