spring.application.name=api

# Habilita o console web do H2
spring.h2.console.enabled=true

# Caminho do console H2
spring.h2.console.path=/h2-console

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Explicitly load the development seed data on application startup.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# Defer schema management to schema.sql; Hibernate must not recreate or drop tables.
spring.jpa.hibernate.ddl-auto=none

# JWT: configure JWT_SECRET with a long random secret outside local development.
app.jwt.secret=${JWT_SECRET:bG9jYWwtZGV2ZWxvcG1lbnQtc2VjcmV0LWNoYW5nZS1iZWZvcmUtZGVwbG95LTEyMzQ1Ng==}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# Set true behind HTTPS in production.
app.cookie.secure=${COOKIE_SECURE:false}

# CORS origins, following the reference configuration.
cors.allowedOrigins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
